name: aklatna
description: أكلاتنا - تطبيق طلب الطعام في داريا
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # State Management
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Backend — Supabase
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  supabase_flutter: ^2.8.4

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Dependency Injection
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  get_it: ^8.0.3

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Navigation
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  go_router: ^15.1.2

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Error Handling
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  dartz: ^0.10.1

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Local Storage
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Network
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  connectivity_plus: ^6.1.4

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Images
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # UI Helpers
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0              # loading skeletons
  fluttertoast: ^8.2.12        # toast messages
  url_launcher: ^6.3.1         # open phone / whatsapp
  intl: ^0.20.2                # date + number formatting

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Environment Variables
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  flutter_dotenv: ^5.2.1
  bloc: ^9.2.1
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
  - family: PlusJakartaSans
    fonts:
      - asset: assets/fonts/PlusJakartaSans-Regular.ttf
      - asset: assets/fonts/PlusJakartaSans-Medium.ttf
        weight: 500
      - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/PlusJakartaSans-Bold.ttf
        weight: 700