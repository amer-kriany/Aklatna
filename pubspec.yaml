name: aklatna
description: أكلاتنا - تطبيق طلب الطعام في داريا
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # State Management
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Backend — Supabase
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  supabase_flutter: ^2.8.4

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Dependency Injection
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  get_it: ^8.0.3

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Navigation
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  go_router: ^15.1.2

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Error Handling
  # ━━━━━━━━━━━━━━━━━━━━━━━━

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Local Storage
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  shared_preferences: ^2.5.5

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Network
  # ━━━━━━━━━━━━━━━━━━━━━━━━

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Images
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  image_picker: ^1.2.3

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # UI Helpers
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  shimmer: ^3.0.0              # loading skeletons
  url_launcher: ^6.3.2         # open phone / whatsapp

  # ━━━━━━━━━━━━━━━━━━━━━━━━
  # Environment Variables
  # ━━━━━━━━━━━━━━━━━━━━━━━━
  flutter_dotenv: ^5.2.1
  bloc: ^9.2.1
  google_fonts: ^8.1.0
  speech_to_text: ^7.4.0
  permission_handler: ^12.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
  - family: PlusJakartaSans
    fonts:
      - asset: assets/fonts/PlusJakartaSans-Regular.ttf
      - asset: assets/fonts/PlusJakartaSans-Medium.ttf
        weight: 500
      - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/PlusJakartaSans-Bold.ttf
        weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"